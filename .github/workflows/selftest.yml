name: selftest
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: scripts/selftest.sh "$RUNNER_TEMP/audit-example"
